# Trek instance B — Alto network address 43 (octal)
SystemType = TwoKRom
HostAddress = 43

# Emulated 3Mbit Ethernet encapsulated in UDP broadcasts on the Wi-Fi adapter
HostPacketInterfaceType = UDPEncapsulation
HostPacketInterfaceName = Wi-Fi

ThrottleSpeed = True
BootAddress = 0
BootFile = 0
AlternateBootType = Ethernet

KioskMode = False
AllowKioskExit = True
PauseWhenNotActive = False
FullScreenStretch = False
SlowPhosphorSimulation = True
DisplayScale = 1

EnablePrinting = false
PrintOutputPath = .
ReversePageOrder = true

# Each instance needs its OWN disk image copy (changes are written back on exit)
Drive0Image = Disks\gamesB.dsk
